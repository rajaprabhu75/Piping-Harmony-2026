<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Register — {{ event_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background:#f4f5f7; margin:0; padding:0; }
    .card { max-width: 440px; margin: 60px auto; background:#fff; border-radius:10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 32px; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color:#666; font-size: 14px; margin-bottom: 24px; }
    label { display:block; margin-top: 14px; font-size: 13px; font-weight:bold; color:#333; }
    input { width:100%; padding:10px; margin-top:6px; border:1px solid #ccc; border-radius:6px;
            box-sizing:border-box; font-size:14px; }
    button { margin-top: 22px; width:100%; padding:12px; background:#2563eb; color:#fff;
             border:none; border-radius:6px; font-size:15px; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .flash { padding:10px 14px; border-radius:6px; margin-bottom:16px; font-size:14px; }
    .flash.success { background:#dcfce7; color:#166534; }
    .flash.error { background:#fee2e2; color:#991b1b; }
    .event-box { background:#eef2ff; border-radius:8px; padding:12px 14px; font-size:13px;
                 color:#3730a3; margin-bottom:20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ event_name }}</h1>
    <div class="sub">Register below — your QR code will be emailed to you.</div>

    <div class="event-box">
      📅 {{ event_date }} &nbsp;|&nbsp; 📍 {{ event_venue }}
    </div>

    <form action="{{ url_for('register') }}" method="post">
      <label for="emp_id">Employee ID</label>
      <input type="text" id="emp_id" name="emp_id" required>

      <label for="name">Full name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone (optional)</label>
      <input type="tel" id="phone" name="phone">

      <button type="submit">Register &amp; get my QR code</button>
    </form>
  </div>
</body>
</html>
