<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <title>Live Counts — {{ event_name }}</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <style>

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:#111827;
      color:#fff;
      margin:0;
      padding:40px 20px;
    }

    h1 {
      text-align:center;
      font-size:22px;
      margin-bottom:30px;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(
        auto-fit,
        minmax(180px, 1fr)
      );
      gap:20px;
      max-width:900px;
      margin:0 auto;
    }

    .team-card {
      border-radius:12px;
      padding:24px 15px;
      text-align:center;
      min-height:110px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      box-sizing:border-box;
    }


    /*
      Six team colors
    */

    .team-bolt-billa {
      background:#1d4ed8;
    }

    .team-elbow-ekambaram {
      background:#15803d;
    }

    .team-jacketed-jackson {
      background:#b45309;
    }

    .team-nozzle-nesamani {
      background:#b91c1c;
    }

    .team-reducer-reeta {
      background:#7c3aed;
    }

    .team-valve-vallaiyapathi {
      background:#0891b2;
    }


    .team-card .label {
      font-size:16px;
      opacity:0.9;
      line-height:1.3;
    }

    .team-card .count {
      font-size:40px;
      font-weight:bold;
      margin-top:6px;
    }

    .footer {
      text-align:center;
      margin-top:30px;
      font-size:13px;
      color:#9ca3af;
    }

    .links {
      text-align:center;
      margin-top:16px;
    }

    .links a {
      color:#60a5fa;
      font-size:13px;
      margin-right:16px;
      text-decoration:none;
    }

    .links a:last-child {
      margin-right:0;
    }


    /*
      Mobile layout
    */

    @media (max-width:600px) {

      body {
        padding:30px 15px;
      }

      h1 {
        font-size:20px;
      }

      .grid {
        grid-template-columns:repeat(2, 1fr);
        gap:12px;
      }

      .team-card {
        padding:20px 10px;
        min-height:105px;
      }

      .team-card .label {
        font-size:13px;
      }

      .team-card .count {
        font-size:34px;
      }

    }

  </style>

</head>


<body>


  <h1>
    {{ event_name }} — Live Team Counts
  </h1>


  <div
    class="grid"
    id="grid"
  >


    <!-- =====================================================
         BOLT BILLA
         ===================================================== -->

    <div class="team-card team-bolt-billa">

      <div class="label">
        Bolt Billa
      </div>

      <div
        class="count"
        id="count-bolt-billa"
      >
        -
      </div>

    </div>


    <!-- =====================================================
         ELBOW EKAMBARAM
         ===================================================== -->

    <div class="team-card team-elbow-ekambaram">

      <div class="label">
        Elbow Ekambaram
      </div>

      <div
        class="count"
        id="count-elbow-ekambaram"
      >
        -
      </div>

    </div>


    <!-- =====================================================
         JACKETED JACKSON
         ===================================================== -->

    <div class="team-card team-jacketed-jackson">

      <div class="label">
        Jacketed Jackson
      </div>

      <div
        class="count"
        id="count-jacketed-jackson"
      >
        -
      </div>

    </div>


    <!-- =====================================================
         NOZZLE NESAMANI
         ===================================================== -->

    <div class="team-card team-nozzle-nesamani">

      <div class="label">
        Nozzle Nesamani
      </div>

      <div
        class="count"
        id="count-nozzle-nesamani"
      >
        -
      </div>

    </div>


    <!-- =====================================================
         REDUCER REETA
         ===================================================== -->

    <div class="team-card team-reducer-reeta">

      <div class="label">
        Reducer Reeta
      </div>

      <div
        class="count"
        id="count-reducer-reeta"
      >
        -
      </div>

    </div>


    <!-- =====================================================
         VALVE VALLAIYAPATHI
         ===================================================== -->

    <div class="team-card team-valve-vallaiyapathi">

      <div class="label">
        Valve Vallaiyapathi
      </div>

      <div
        class="count"
        id="count-valve-vallaiyapathi"
      >
        -
      </div>

    </div>


  </div>


  <div
    class="footer"
    id="footer"
  >
    Loading...
  </div>


  <div class="links">

    <a
      href="{{ url_for('scan_station') }}"
    >
      Scan station →
    </a>

    <a
      href="{{ url_for('admin_login') }}"
    >
      Participant data →
    </a>

  </div>


  <script>

    async function refresh() {

      try {

        const res = await fetch('/counts');

        const data = await res.json();


        /*
          Update all six team counts.

          The API returns the team names as keys, for example:

          data["Bolt Billa"]
          data["Elbow Ekambaram"]
          etc.
        */

        const teams = [

          {
            name: 'Bolt Billa',
            elementId: 'count-bolt-billa'
          },

          {
            name: 'Elbow Ekambaram',
            elementId: 'count-elbow-ekambaram'
          },

          {
            name: 'Jacketed Jackson',
            elementId: 'count-jacketed-jackson'
          },

          {
            name: 'Nozzle Nesamani',
            elementId: 'count-nozzle-nesamani'
          },

          {
            name: 'Reducer Reeta',
            elementId: 'count-reducer-reeta'
          },

          {
            name: 'Valve Vallaiyapathi',
            elementId: 'count-valve-vallaiyapathi'
          }

        ];


        teams.forEach(team => {

          const element =
            document.getElementById(
              team.elementId
            );

          if (element) {

            element.textContent =
              data[team.name] ?? 0;

          }

        });


        /*
          Overall event statistics
        */

        document.getElementById(
          'footer'
        ).textContent =
          `Registered: ${data.total_registered} | ` +
          `Scanned: ${data.total_scanned} | ` +
          `Not yet scanned: ${data.unscanned}`;


      } catch (e) {

        document.getElementById(
          'footer'
        ).textContent =
          'Failed to refresh counts.';

      }

    }


    /*
      Initial load
    */

    refresh();


    /*
      Auto-refresh every 4 seconds
    */

    setInterval(
      refresh,
      4000
    );

  </script>


</body>

</html>
